<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cart</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fa;
        font-family: Arial, Helvetica, sans-serif;
      }

      .navbar-brand {
        font-weight: bold;
        font-size: 22px;
      }

      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .logo {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
      }

      .card img {
        height: 180px;
        object-fit: contain;
        padding: 10px;
        background: #f8f9fa;
      }

      .card-title {
        font-weight: bold;
      }

      .btn-danger {
        border-radius: 20px;
        padding: 5px 15px;
      }

      .total-box {
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 250px;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img
            class="logo me-2"
            src="https://i.vimeocdn.com/player/329499?sig=85e0febaa7d3a011c11a4bdbdb857854c06938e5cfea786c7b7ce9a6b911bd04&v=1"
            alt=""
          />
          My Cart
        </a>

        <a href="index.html" class="btn btn-light">Back to Products</a>
      </div>
    </nav>

    <div class="container mt-5">
      <h3 class="mb-4 text-center">Your Shopping Cart</h3>

      <div class="row" id="cartItems"></div>

      <div class="d-flex justify-content-center mt-4">
        <div class="total-box text-center">
          <h5>Total Price</h5>
          <h4 class="text-success">Rs <span id="total">0</span></h4>
        </div>
      </div>
    </div>

    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const list = document.getElementById("cartItems");

      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;

        list.innerHTML += `

<div class="col-lg-4 col-md-6 mb-4">

<div class="card text-center">

<img src="${item.image}" class="card-img-top">

<div class="card-body">

<h5 class="card-title">${item.name}</h5>

<p class="card-text text-primary fw-bold">Rs ${item.price}</p>

<button class="btn btn-danger btn-sm"
onclick="removeItem(${index})">

Remove

</button>

</div>

</div>

</div>

`;
      });

      document.getElementById("total").innerText = total;

      function removeItem(index) {
        cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));

        location.reload();
      }
    </script>
  </body>
</html>
