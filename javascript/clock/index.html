<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .clock-box {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      .time-box {
        font-size: 2rem;
        font-weight: bold;
        padding: 10px 15px;
        border-radius: 10px;
        background-color: #f8f9fa;
        min-width: 70px;
      }
    </style>
  </head>

  <body>
    <div class="clock-box">
      <h1 class="mb-4 text-primary">Digital Clock</h1>

      <div class="d-flex justify-content-center gap-3">
        <div id="hours" class="time-box border">00</div>
        <div id="minutes" class="time-box border">00</div>
        <div id="seconds" class="time-box border">00</div>
        <div id="zone" class="time-box border bg-dark text-white"></div>
      </div>
    </div>

    <script>
      setInterval(() => {
        let t = new Date();
        document.getElementById("hours").innerHTML = t.getHours();
        document.getElementById("minutes").innerHTML = t.getMinutes();
        document.getElementById("seconds").innerHTML = t.getSeconds();
        if (t.getHours() >= 12) {
          document.getElementById("zone").innerHTML = "PM";
        } else {
          document.getElementById("zone").innerHTML = "AM";
        }
      }, 1000);
    </script>
  </body>
</html>
