<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cart</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #fdfbfb, #ebedee);
        font-family: Segoe UI;
      }

      .navbar {
        background: linear-gradient(90deg, #1e3a8a, #4f46e5);
      }

      .navbar-brand {
        font-weight: 600;
        font-size: 22px;
        color: white;
      }

      .logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }

      h3 {
        font-weight: 600;
        color: #1e293b;
      }

      .cart-card {
        background: white;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      .cart-card:hover {
        transform: translateY(-3px);
      }

      .product-img {
        height: 120px;
        object-fit: contain;
        background: #f1f5f9;
        padding: 10px;
        border-radius: 10px;
      }

      .price {
        font-size: 18px;
        font-weight: 600;
        color: #2563eb;
      }

      .btn-danger {
        background: #ef4444;
        border: none;
        border-radius: 25px;
        padding: 8px 20px;
      }

      .btn-danger:hover {
        background: #dc2626;
      }

      .total-box {
        background: white;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        font-size: 22px;
        font-weight: 600;
      }

      .total-text {
        color: #334155;
      }

      .total-price {
        color: #16a34a;
        font-size: 28px;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center text-white">
          <img
            class="logo me-2"
            src="https://cdn-icons-png.flaticon.com/512/8828/8828150.png"
          />

          Shopping Cart
        </a>

        <div>
          <a href="index.html" class="btn btn-light me-2">Home</a>

          <a href="cart.html" class="btn btn-warning">Cart</a>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h3 class="text-center mb-4">Shopping Cart</h3>

      <div id="cartItems"></div>

      <div class="total-box mt-4 d-flex justify-content-between">
        <div class="total-text">Your Payable Amount</div>

        <div class="total-price">₹<span id="total">0</span></div>
      </div>
    </div>

    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const list = document.getElementById("cartItems");

      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;

        list.innerHTML += `

<div class="cart-card mb-3">

<div class="row align-items-center">

<div class="col-md-3 text-center">

<img src="${item.image}" class="img-fluid product-img">

</div>

<div class="col-md-5">

<h5>${item.name}</h5>

<p class="price">₹${item.price}</p>

</div>

<div class="col-md-4 text-md-end text-center">

<button class="btn btn-danger"
onclick="removeItem(${index})">

Remove Item

</button>

</div>

</div>

</div>

`;
      });

      document.getElementById("total").innerText = total;

      function removeItem(index) {
        cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));

        location.reload();
      }
    </script>
  </body>
</html>
```
