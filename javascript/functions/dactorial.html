<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numf = +prompt("enetr the number");
      function factorial(num) {
        let mul = 1;

        for (let i = 1; i <= num; i++) {
          mul = mul * i;
        }
        document.write(`${mul}`);
      }
      factorial(numf);
    </script>
  </body>
</html>
