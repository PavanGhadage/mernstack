<!doctype html>
<html>
  <body>
    <script>
      let num = +prompt("Enter the number");

      let result = "";

      for (let i = 1; i <= 10; i++) {
        result += num * i;

        if (i < 10) {
          result += ", ";
        } else {
          result += ".";
        }
      }

      console.log("The multiplication table of " + num + " is: " + result);
    </script>
  </body>
</html>
