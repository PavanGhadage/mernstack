<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      let num = prompt("enetr the num");
      let mul = 1;
      for (let i = 1; i <= num; i++) {
        mul = i * mul;
      }
      document.write("the factorial of " + num + "is " + mul);
    </script>
  </body>
