<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = +prompt("enter the num");
      let count = 0;
      for (let i = 1; i <= num; i++) {
        if (i % 2 === 0) {
          count++;
        }
      }
      console.log("the even numners between 1 to" + num + "is" + count);
    </script>
  </body>
</html>
