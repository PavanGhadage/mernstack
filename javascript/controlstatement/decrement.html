<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = prompt("enter the numner");

      for (let i = num; i >= 1; i--) {
        if (i > 1) {
          document.write(`${i},`);
        } else {
          document.write(`${i} .`);
        }
      }
    </script>
  </body>
</html>
