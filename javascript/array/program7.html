<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr1 = [];
      let arr2 = [];
      let size = prompt("enter the size of array1 ");
      for (let i = 0; i < size; i++) {
        arr1[i] = +prompt(` enter the number of arr1 ${i + 1}`);
      }
      let size2 = prompt("enter the size of array2 ");
      for (let i = 0; i < size2; i++) {
        arr2[i] = +prompt(` enter the number of arr2 ${i + 1}`);
      }
      let arr3 = arr1.concat(arr2);
      arr3.sort((a, b) => b - a);
      console.log(arr3);
    </script>
  </body>
</html>
