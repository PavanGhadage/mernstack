<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr1 = [];

      let size = prompt("enter the size of array1 ");
      for (let i = 0; i < size; i++) {
        arr1[i] = +prompt(` enter the number of arr1 ${i + 1}`);
      }
      let issorted = true;

      for (let i = 0; i < arr1.length; i++) {
        if (arr1[i] > arr1[i + 1]) {
          issorted = false;
          break;
        }
      }
      if (issorted) {
        console.log(`the given array is sorted`);
      } else {
        console.log(`the given array is not sortyed`);
      }
    </script>
  </body>
</html>
