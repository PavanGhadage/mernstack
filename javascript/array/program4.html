<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [];
      let size = prompt("enter the size of array ");
      for (let i = 0; i < size; i++) {
        arr[i] = +prompt(` enter the number ${i + 1}`);
      }
      let element = +prompt("element to check ");
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if (element === arr[i]) {
          count++;
        }
      }
      console.log(`${element} is repeated in array ${count} times`);
    </script>
  </body>
</html>
