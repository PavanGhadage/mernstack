<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [];
      let size = prompt("enter the size of array ");
      for (let i = 0; i < size; i++) {
        arr[i] = +prompt(` enter the number ${i + 1}`);
      }

      let max1 = -Infinity;
      let max2 = -Infinity;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > max1) {
          max2 = max1;
          max1 = arr[i];
        } else if (arr[i] > max2 && max1 != arr[i]) {
          max2 = arr[i];
        }
      }
      console.log(`largest elemt is  ${max1}`);
      console.log(` second largest elemt is  ${max2}`);
    </script>
  </body>
</html>
