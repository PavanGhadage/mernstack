<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num1 = +prompt("Enter the first number");
      let num2 = +prompt("Enter the second number");

      document.write(`The addition of the two numbers is ${num1 + num2}`);
      document.write("<br>");
      document.write(`The subtraction of the two numbers is ${num1 - num2}`);
      document.write("<br>");
      document.write(`The multiplication of the two numbers is ${num1 * num2}`);
      document.write("<br>");
      document.write(`The division of the two numbers is ${num1 / num2}`);
    </script>
  </body>
</html>
