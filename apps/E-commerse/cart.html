<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .cart-img {
        width: 80px;
        height: 80px;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img
            src="assets/img.webp"
            alt="Logo"
            class="rounded-circle me-2"
            style="width: 40px; height: 40px; object-fit: cover"
          />
          <span class="fw-bold">MyShop</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="catogories.html">Categories</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>

          <form class="d-flex me-3">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
            />
            <button class="btn btn-outline-light" type="submit">Search</button>
          </form>

          <div class="d-flex">
            <a href="loginup.html" class="btn btn-outline-light me-2">Login</a>
            <a href="register.html" class="btn btn-warning">Register</a>
          </div>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <h2 class="mb-4">Shopping Cart</h2>

      <div class="row">
        <div class="col-lg-8">
          <div class="card mb-3 shadow-sm">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-md-2 text-center">
                  <img src="assets/samsung24.jpg" class="cart-img" />
                </div>

                <div class="col-md-3">
                  <h6>Samsung S24</h6>
                </div>

                <div class="col-md-2 text-primary">₹79,999</div>

                <div class="col-md-3">
                  <input type="number" class="form-control" value="1" min="1" />
                </div>

                <div class="col-md-2 text-end">
                  <button class="btn btn-danger btn-sm">Remove</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-3 shadow-sm">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-md-2 text-center">
                  <img src="assets/nike.jpg" class="cart-img" />
                </div>

                <div class="col-md-3">
                  <h6>Nike Shoes</h6>
                </div>

                <div class="col-md-2 text-primary">₹6,999</div>

                <div class="col-md-3">
                  <input type="number" class="form-control" value="1" min="1" />
                </div>

                <div class="col-md-2 text-end">
                  <button class="btn btn-danger btn-sm">Remove</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow">
            <div class="card-body">
              <h5 class="mb-3">Order Summary</h5>

              <div class="d-flex justify-content-between">
                <span>Subtotal</span>
                <span>₹86,998</span>
              </div>

              <div class="d-flex justify-content-between">
                <span>Shipping</span>
                <span>₹0</span>
              </div>

              <hr />

              <div class="d-flex justify-content-between fw-bold">
                <span>Total</span>
                <span>₹86,998</span>
              </div>

              <button class="btn btn-success w-100 mt-3">
                Proceed to Checkout
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
