<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function calculate() {
        const arr = [10, 20, 30, 40];
        const data = arr.reduce((acc, my) => {
          return acc + my;
        }, 0);
        return data;
      }

      function execute(callback) {
        return callback();
      }

      const result = execute(calculate);

      console.log(result);
    </script>
  </body>
</html>
