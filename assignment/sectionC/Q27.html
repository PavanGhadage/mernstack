  <body>
    <script>
      function greet(callback) {
        const name = "raj";
        console.log(name);
        return callback();
      }

      function execute() {
        var num = 15;
        console.log("my name is pavan");
        return num;
      }
      const result = greet(execute);
      console.log(result);
    </script>
