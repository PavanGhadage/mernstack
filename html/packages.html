<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Signature&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #607179;
      }

      .navbar {
        height: 100px;
        display: flex;
        align-items: center;
        background-color: rgba(199, 200, 188, 0.933);
        border-radius: 5px;
        box-shadow: 2px 2px 2px grey;
        padding: 5px;
        position: sticky;
      }
      .left {
        display: flex;
        justify-content: space-between;
        align-items: center;
        /* border: 2px solid black; */
        width: 25%;
        h1 {
          font-style: italic;
          font-family:
            "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
          text-shadow: 2px 2px rgb(63, 53, 58);
        }

        img {
          height: 80px;
          width: 100px;
          border-radius: 70px;
        }
      }
      .right {
        margin-left: auto;

        ul {
          list-style: none;
          gap: 20px;
          display: flex;
        }
        a {
          color: rgb(13, 12, 12);
          font-family: "Oswald";
        }
        a:link {
          text-decoration: none;
          color: black;
        }
        a:visited {
          text-decoration: underline;
          color: rgb(17, 16, 16);
        }
        a:hover {
          text-decoration: underline;
          color: rgb(80, 7, 7);
        }
        a:active {
          text-decoration: underline;
          color: green;
        }
      }
      .maindiv {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        align-items: center;
        justify-content: space-between;

        gap: 20px;
        text-align: center;
      }
      .maindiv img {
        width: 100%;
        height: 300px;
        object-fit: fill;
        border-radius: 20px;
      }
      .maindiv a:hover {
        color: aquamarine;
        text-decoration: none;
      }
      .maindiv a:active {
        color: rgb(255, 127, 157);
        text-decoration: underline;
      }
      a {
        text-decoration: none;
        color: black;
      }
      .body {
        background-color: rgb(235, 238, 238);
      }
      footer {
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        text-align: center;
        padding: 15px 10px;
        font-family: "Oswald", sans-serif;
      }

      footer p {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="left">
          <img src="assets/logo.jpg" alt="logo of website" />
          <h1>Wonderful Tourism</h1>
        </div>

        <div class="right">
          <ul>
            <li><a href="./index.html" target="_self">Home</a></li>
            <li><a href="./aboutus.html" target="_self">About us</a></li>
            <li><a href="./packages.html" target="_self">package </a></li>
            <li><a href="./services.html" target="_self">services</a></li>

            <li><a href="./contactus.html" target="_self">contact us</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <hr />
    <h2>Our Package</h2>

    <div class="maindiv">
      <a href="./west.html" target="_self">
        <h3>West India</h3>
        <img
          id=""
          src="assets/2west.jpg"
          alt="photo of taj hotel"
          height="300"
          width="400"
      /></a>
      <a href="./eastindia.html">
        <h3>East india</h3>
        <img src="assets/east.jpg" alt="" height="300" width="400"
      /></a>
      <a href="./northindia.html"
        ><h3>North india</h3>
        <img src="assets/north.jpg" alt="" height="300" width="400"
      /></a>

      <a href="./soouthindia.html"
        ><h3>South india</h3>
        <img src="assets/south.jpg" alt="" height="300" width="400"
      /></a>
    </div>
  </body>
  <footer>
    <p>© 2026 Wonderful Tourism | All Rights Reserved</p>
  </footer>
